# Задание 5.1: self-hosted раннер Gitea Actions внутри кластера.
# Работает в режиме host: шаги пайплайна выполняются прямо в контейнере раннера,
# а сборку образа он отдаёт Kubernetes Job с Kaniko (без Docker-in-Docker).
apiVersion: v1
kind: ServiceAccount
metadata: { name: ci-runner, namespace: ci }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ci-runner-builds, namespace: ci }
rules:
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-runner-builds, namespace: ci }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner-builds }
subjects: [ { kind: ServiceAccount, name: ci-runner, namespace: ci } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ci-runner-argocd, namespace: argocd }
rules:
  - apiGroups: ["argoproj.io"]
    resources: [applications]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-runner-argocd, namespace: argocd }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner-argocd }
subjects: [ { kind: ServiceAccount, name: ci-runner, namespace: ci } ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ci-runner-readonly, namespace: flashmarket }
rules:
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-runner-readonly, namespace: flashmarket }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ci-runner-readonly }
subjects: [ { kind: ServiceAccount, name: ci-runner, namespace: ci } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: act-runner, namespace: ci }
spec:
  replicas: 1
  selector: { matchLabels: { app: act-runner } }
  template:
    metadata: { labels: { app: act-runner } }
    spec:
      serviceAccountName: ci-runner
      containers:
        - name: runner
          image: fm-act-runner:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: GITEA_INSTANCE_URL, value: "http://gitea-http.git.svc:3000" }
            - { name: GITEA_RUNNER_NAME, value: "k8s-runner" }
            - { name: GITEA_RUNNER_LABELS, value: "k8s:host" }
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom: { secretKeyRef: { name: runner-registration, key: token } }
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 256Mi } }
          volumeMounts: [ { name: data, mountPath: /data } ]
      volumes:
        - name: data
          emptyDir: {}
