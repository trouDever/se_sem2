# Задание 3.2: L4-балансировщик перед Istio Gateway (NodePort 30080 на нодах кластера)
global
  maxconn 20000
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s   # больше, чем таймаут внутри mesh (5 с): внешний слой не обрывает запрос раньше внутреннего

frontend fe_http
  bind *:80
  maxconn 5000          # грубая защита на L4, тонкий лимит — на gateway
  default_backend be_gateway

backend be_gateway
  balance leastconn
  option tcp-check
  default-server inter 2s fall 2 rise 2
  server node1 172.30.0.2:30080 check

frontend stats
  mode http
  bind *:8404
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /stats
