# Задание 1.2: Cluster Autoscaler с провайдером kwok.
# Karpenter работает только с облаками, поэтому локально автоскейлер создаёт фиктивные ноды kwok:
# решения о масштабировании настоящие, а поды на этих нодах только «играют роль» запущенных.
apiVersion: v1
kind: ConfigMap
metadata: { name: kwok-provider-config, namespace: kube-system }   # перезаписывает ConfigMap из чарта
data:
  config: |
    apiVersion: v1alpha1
    readNodesFrom: configmap
    nodegroups:
      fromNodeLabelKey: "kwok-nodegroup"
    nodes:
      skipTaint: true          # taint задаём сами в шаблоне ниже
    configmap:
      name: fm-kwok-templates
    kwok:
      install: false           # kwok-контроллер ставим отдельно (infra/autoscaler/kwok.yaml)
---
apiVersion: v1
kind: ConfigMap
metadata: { name: fm-kwok-templates, namespace: kube-system }
data:
  templates: |   # ключ templates зашит в провайдере (kwok_helpers.go)
    apiVersion: v1
    kind: List
    items:
      - apiVersion: v1
        kind: Node
        metadata:
          name: kwok-worker-template
          annotations:
            cluster-autoscaler.kwok.nodegroup/min-count: "0"
            cluster-autoscaler.kwok.nodegroup/max-count: "5"
          labels:
            kwok-nodegroup: kwok-worker
            kubernetes.io/arch: amd64
            kubernetes.io/os: linux
            node.kubernetes.io/instance-type: kwok-4cpu-8gi
            type: kwok
        spec:
          taints:
            - { key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }   # настоящие поды сюда не попадут
        status:
          allocatable: { cpu: "4", memory: 8Gi, pods: "110", ephemeral-storage: 20Gi }
          capacity: { cpu: "4", memory: 8Gi, pods: "110", ephemeral-storage: 20Gi }
          nodeInfo: { architecture: amd64, operatingSystem: linux, kubeletVersion: fake }
